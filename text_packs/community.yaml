# 社区版菜单文案 —— 草稿（T2.4 定稿）
# 用法：config.yaml bot.text_pack: text_packs/community.yaml
# 仅覆盖 menu_text 键，其余文案键回落内置（bot_menu_text.py）；{NICKNAME} 自动替换为配置昵称。
# 指令集 = 社区默认两包（打卡基础 + 经济扩展）+ 管理员指令；触发词与私有版一致，仅描述中性化。
menu_text: |
  {NICKNAME}指令菜单
  ---------------------------
  【通用指令】
  /菜单 查看菜单
  /打卡 + 图片 完成打卡
  /档案 [年份] 查看个人打卡档案
  /本周打卡图 查看本周打卡图
  /ALL 查看全量打卡图统计
  /补卡 [YYYY-MM-DD] 周补卡（4点）
  /单日补卡 [YYYY-MM-DD] 单日补卡（2点）
  /撤回打卡 撤回本周最近一次打卡
  /周常 查看本周任务进度
  /抽奖 或 /抽卡 消耗积分抽奖（每日次数与打卡状态相关）
  /一键抽奖 连续抽完今日剩余抽奖次数，合并转发所有结果
  /抽卡消费 [@用户] 查询累计抽卡消费积分
  /排名 或 /rank 查看积分排行榜
  /商店 [商品id] 积分商店（无参数列出本周货架，每周一 8:00 刷新）
  /兑换码 <兑换码> 使用兑换码兑换奖励（格式 XXXX-XXXX-XXXX）
  /称号 查看称号系统帮助
  /称号一览 查看已解锁称号
  /称号 当前 查看当前装备称号
  /称号 <index> 装备称号
  /称号 卸下 取消装备称号
  /称号 详情 <index> 查看称号说明
  /称号 随机 随机装备一个已解锁称号
  /称号 查看 @用户 查看他人称号
  {NICKNAME} 召唤机器人

  【群聊功能】
  /本周板油 查看本周打卡成员

  【管理员指令】
  /超级补卡 YYYY-MM-DD [user_id] 免扣点补整周
  /超级单日补卡 YYYY-MM-DD [user_id] 免扣点补单日
  /发金币 <数量> 给所有用户统一发积分
  /刷新商店 立刻刷新积分商店货架
  /数据备份 手动执行备份
  /系统状态 查看运行状态（超级用户）
  /更新 拉取更新并重启（超级用户）
  /插件 <name|列表> [off] [群号] 管理插件：列表/启用/禁用（超级用户）
  /功能包 <name|列表> [off] [群号] 管理功能包：列表/开启/关闭（超级用户）
  /插件 <name> <开启|关闭|默认> 用户 <账号> 设置该账号的私聊插件（超级用户）
  /功能包 <name> <开启|关闭|默认> 用户 <账号> 批量设置该账号的私聊插件（超级用户）
  /插件 列表 用户 <账号> 查看账号设置；/功能包 列表 用户 <账号> 查看账号功能包
  两条管理指令均可用 <name> <开启|关闭> 群 <群号> 明确指定群
  默认：恢复沿用私聊公共设置；系统插件不能关闭
  不指定目标时，私聊修改私聊公共设置，群聊修改本群设置
