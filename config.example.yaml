# BotEro 统一配置文件 —— bot（main.py）与 webapp 共用，部署侧单一来源。
# 使用：cp config.example.yaml config.yaml 后填写真实值；本文件不进 git。
# 定位：默认项目根 config.yaml；可用环境变量 BOTERO_CONFIG 指向其他路径（仅此一个环境变量）。
# 修改后需重启对应进程生效。

bot:
  edition: private              # 部署描述标签（仅日志展示，不参与任何控制流；两种部署只靠配置值区分）
  qq: "3915014383"            # Bot 的 QQ 号（必须加引号保持字符串）
  nickname: 小埃同学           # 机器人昵称
  super_users: [1057613133]   # 超级用户 QQ 号列表（插件/功能包/账号设置仅超级用户可改）
  default_group: 296470819    # 默认群号（可选：无群上下文的公告/周报目的地；省略 = 无默认群，无群上下文的群发将被丢弃）
  ws_url: ws://127.0.0.1:3001   # OneBot v11 WebSocket 地址
  ws_token: "123456"            # WS 鉴权 token
  download_proxy: "http://127.0.0.1:7890"  # 图片下载代理；留空 "" 直连
  llonebot_data_path: /app/llonebot/server_data  # OneBot API 调用看到的路径（容器内）
  python_data_path: ./server_data               # Python 文件 I/O 用的路径
  onebot_qq_volume: ""      # docker 卷路径（裸机部署留空）
  allowed_plugins: []       # 部署允许范围（config-unification）：缺省 = 允许全部已安装插件（旧配置兼容）；非空列表 = 精确限定（名单外插件对消息/心跳/内部通知全部失效，管理命令不能开启）；空列表无效。公开部署应显式配置，新增插件不自动开放。标识见 kb/PLUGIN_CATALOG.md
  system_plugins: []        # 可选：系统插件集（不可按群禁用）。非空 = 精确替换（未列入项回归按群开关）；空/缺省 = 内置 8 项（menu/group_manager/startup_changelog/backup/update/auto_friend/welcome/message_logger）。系统集合必须是 allowed_plugins 子集
  feature_packs_file: ""    # 可选：功能包定义文件（如 feature_packs_public.yaml）。缺省 = 内置 6 包；非空 = 整体替换（相对路径以本配置所在目录为基准）；只定义分组，不自动开启。包内引用未注册插件启动报错
  text_pack: ""             # 可选：文案包路径（如 text_packs/community.yaml）。包内键覆盖内置文案，缺键回落；空/缺省 = 内置文案（bot_menu_text.py 等代码内基线），重启生效。菜单已结构化：menu.<指令词> 逐条覆盖；旧 menu_text 整段覆盖已停用

# OneBot HTTP（拉取 QQ 昵称；配置 http_url 则必须同配 token——与时间线同理按实际启用校验）
onebot:
  http_url: http://192.168.0.103:3000  # OneBot HTTP（拉取 QQ 昵称）
  token: "123456"

# 数据路径（可选，缺省即下列布局；相对路径按项目根解析）
paths:
  db: data.db
  message_log_db: server_data/message_log.db
  images: server_data/record_images
  trpg_chars: server_data/trpg_chars
  user_settings: server_data/user_settings
  activity: server_data/activity_archive
  forum_images: server_data/forum_images

webapp:
  host: 0.0.0.0
  port: 8765

auth:
  salt: ChangeMe-Random-Salt    # 登录密钥盐（HMAC）：bot 生成密钥与 webapp 验证共用
  old_salts: []                 # 换盐后把旧盐加进此列表，旧密钥继续有效（无感迁移）

# 社区时间线上报（私有形态必填——webapp Event Server 地址；社区形态留空/省略 = 上报关闭）
timeline:
  url: http://127.0.0.1:8765   # Event Server 基地址
  token: ChangeMe-Timeline-Token  # 系统间事件令牌（与用户登录密钥不同）

weekly:
  web_base_url: https://littlero.tech  # 周报通知链接前缀
  notify: true                          # 周报出版通知（群消息 + 时间线事件）

uploads:
  checkin_max_images: 9
  checkin_max_bytes: 10485760       # 10MB
  forum_image_max_bytes: 10485760   # 10MB

thumbs:
  cache_dir: server_data/thumb_cache
  max_width: 480
  max_height: 720
  jpeg_quality: 82

live:
  flv_url: https://live.littlero.tech/live/livestream.flv

tools:
  icon_proxy: ""    # 工具箱图标抓取代理；留空不走代理

mail:
  url: ""            # cloud-mail（Skymail）站点基地址；留空 = 邮件功能关闭
  email: ""          # 发件账号（管理员邮箱，登录换 token 用）
  password: ""
  sender_name: ""    # 发件人显示名（可选，空则自动截取邮箱前缀）
  proxy: ""          # 可选；仅 cloud-mail 请求经此代理出网（如 http://127.0.0.1:7890），留空 = 直连

panel:
  host: "0.0.0.0"    # bot 内置监控面板（局域网访问；仅本机改 127.0.0.1）
  port: 8790

community:                 # 逐步开放公共部署的运营参数（与描述标签无关，任何部署配置即生效）
  max_groups: 50               # 最大激活群数（入群审核超限直接拒绝）
  cmd_cooldown_seconds: 0      # 同用户同指令冷却秒数（缺省统一 0=关闭；部署差异写进各自配置）

group_review:
  require: false             # 缺省关闭，旧部署无需群审核；开启后须将group_review加入允许名单及系统集
  default_pack: 基础包       # 本模板用内置包；公开模板使用打卡基础包
