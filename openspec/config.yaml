schema: spec-driven

context: |
  BotEro：QQ 群聊机器人（OneBot v11 over WebSocket，事件驱动 + 插件架构，纯同步多线程）
  + 单进程 FastAPI 社区站 webapp。社区与私有部署仅配置不同，共用同一实现；禁止按edition选择业务、权限、准入流程或隐式默认值。旧五处edition分支白名单已废弃，见docs/community/config-only-plan-review.md。
  测试统一入口 pytest（conftest 自动隔离数据路径，绝不触真实 data.db/server_data）。
  硬底线：主干逐 commit 必须私有部署安全（旧配置兼容、全量 pytest 绿）；未经授权不得改变行为。plugin-event-dispatch仅获准改变独立开关与消息合并语义，不是任意行为变更许可。
  Commit：中文 Conventional Commits，代码+测试+文档+CHANGELOG 同 commit。

rules:
  proposal:
    - "必须包含「验收标准」章节：每条可独立执行验证（pytest 命令/断言/手测步骤），tasks.md 逐项与之对应"
    - "判据：要 bump BOTERO_VERSION 就要提案；纯文档/测试/内部重构不建 change"
    - "发现旧代码已部分实现时，提案如实记录现状并圈定剩余工作"
  specs:
    - "spec delta 只写外部可观察的行为契约；实现细节进 design.md"
  tasks:
    - "验收标准未逐条全绿不得归档；归档（openspec archive）与实现同一 commit"
