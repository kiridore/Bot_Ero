<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小埃时间线</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
  <link rel="stylesheet" href="/shared/motion.css" />
  <link rel="stylesheet" href="/static/timeline.css" />
</head>
<body>
  <header class="masthead">
    <p class="masthead-issue">小埃中继站 · 社区时间线</p>
    <h1 class="masthead-title">小埃中继站</h1>
    <p class="masthead-sub">向群里大小消息说早安</p>
    <p class="masthead-date" id="mastheadDate"></p>
  </header>

  <div class="tl-layout">
    <aside class="tl-sidebar">
      <a class="tl-brand" href="/">小埃中继站</a>
      <nav class="tl-nav" id="tlNav" aria-label="功能导航">
        <div class="tl-nav-muted">功能</div>
      </nav>
      <div class="tl-auth auth-area" id="authArea"></div>
    </aside>

    <main class="tl-main">
      <header class="tl-head">
        <h1>时间线</h1>
        <span class="tl-head-hint" id="tlStatus"></span>
      </header>
      <button type="button" id="tlNewEvents" class="tl-new-events hidden" aria-live="polite">查看新事件</button>
      <div class="tl-feed" id="feed">
        <div class="tl-empty muted hidden" id="feedEmpty">还没有事件，去打个卡吧</div>
      </div>
      <div class="tl-sentinel" id="sentinel">加载中…</div>
    </main>
  </div>

  <script src="/shared/auth.js?v=3"></script>
  <script src="/shared/lightbox.js"></script>
  <script src="/shared/motion.js"></script>
  <script src="/static/timeline.js"></script>
</body>
</html>
