<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tag 管理 - 议事厅</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
  <link rel="stylesheet" href="/static/forum.css" />
</head>
<body>
  <div class="tl-layout">
    <aside class="tl-sidebar">
      <a class="tl-brand" href="/">小埃中继站</a>
      <nav class="tl-nav" id="tlNav">
        <div class="tl-nav-muted">功能</div>
      </nav>
      <div class="tl-auth auth-area" id="authArea"></div>
    </aside>

    <main class="tl-main">
      <header class="tl-head">
        <h1>tag 管理</h1>
        <a class="forum-link" href="/forum">返回列表</a>
      </header>
      <div id="msg"></div>
      <form id="tagForm" style="margin-bottom:1.5rem">
        <label>新 tag 名</label>
        <input type="text" id="tagName" maxlength="30" required />
        <button type="submit" class="forum-btn" style="margin-top:0.5rem">创建</button>
      </form>
      <h3>现有 tag（按使用数排序）</h3>
      <div class="forum-list" id="tagList"></div>
    </main>

    <aside class="tl-rail"></aside>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/static/forum_tags.js"></script>
</body>
</html>
