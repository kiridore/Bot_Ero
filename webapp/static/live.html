<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小埃直播间</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
  <link rel="stylesheet" href="/shared/profile.css" />
  <style>
    .live-main {
      max-width: 880px;
      margin: 0 auto;
      padding: 1.4rem 1rem 3rem;
    }
    .live-title {
      font-size: 1.3rem;
      letter-spacing: 0.12em;
      color: var(--ink);
      margin: 0 0 0.8rem;
    }
    .live-stage {
      position: relative;
      background: #1a1814;
      border-radius: var(--radius-md);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: var(--shadow-md);
    }
    .live-stage video {
      width: 100%;
      height: 100%;
      display: block;
      background: #1a1814;
    }
    .live-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: rgba(44, 42, 36, 0.66);
      color: var(--paper);
      text-align: center;
      padding: 1rem;
    }
    .live-overlay.hidden { display: none; }
    .live-status-text {
      font-size: 1.05rem;
      letter-spacing: 0.2em;
    }
    .live-play-btn {
      border: 1px solid var(--paper-card);
      background: var(--accent);
      color: var(--paper);
      border-radius: 999px;
      padding: 0.55rem 1.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .live-play-btn:hover { filter: brightness(1.1); }
    .live-play-btn.hidden { display: none; }
    .live-foot {
      margin: 0.8rem 0 0;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }
    .live-foot code {
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 0.1rem 0.35rem;
    }
    .live-viewers {
      margin-top: 1rem;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: var(--radius-md);
      padding: 0.8rem 1rem;
    }
    .live-viewers-title {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      color: var(--ink);
    }
    .live-viewers-count {
      color: var(--accent-ink);
      font-weight: 700;
    }
    .live-viewer-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
    }
    .live-viewer-list li {
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    .live-viewer-list li.muted {
      opacity: 0.75;
    }
    .viewer-tag {
      font-size: 0.7rem;
      color: var(--accent-ink);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0 0.4rem;
      margin-left: 0.25rem;
    }
  </style>
</head>
<body>
  <header class="toolbar profile-toolbar">
    <div class="auth-area" id="authArea"></div>
  </header>

  <main class="live-main">
    <h2 class="live-title">小埃直播间</h2>
    <div class="live-stage" id="liveStage">
      <video id="liveVideo" controls playsinline></video>
      <div class="live-overlay" id="liveOverlay">
        <span class="live-status-text" id="liveStatusText">未开播</span>
        <button type="button" class="live-play-btn hidden" id="livePlayBtn">进入直播间</button>
      </div>
    </div>
    <p class="live-foot">
      直播流：<code>live.littlero.tech/live/livestream.flv</code>（HTTP-FLV，mpegts.js 播放）
    </p>

    <aside class="live-viewers">
      <h3 class="live-viewers-title">当前观众 <span class="live-viewers-count" id="viewerCount">0</span></h3>
      <ul class="live-viewer-list" id="viewerList"><li class="muted">暂无观众</li></ul>
    </aside>
  </main>

  <script src="/shared/auth.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/static/mpegts.min.js"></script>
  <script src="/static/live.js"></script>
</body>
</html>
