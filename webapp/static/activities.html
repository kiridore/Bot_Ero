<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>活动</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
  <link rel="stylesheet" href="/shared/motion.css" />
  <link rel="stylesheet" href="/shared/profile.css" />
  <style>
    .activity-section { margin-bottom: 28px; }
    .activity-section h2 { font-size: 17px; margin: 0 0 12px; color: var(--ink); }
    .activity-card {
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .activity-card.activity-link {
      display: block; text-decoration: none; color: inherit;
      transition: border-color 0.15s;
    }
    .activity-card.activity-link:hover { border-color: var(--accent); }
    .activity-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .activity-card-head h2 { margin: 0; font-size: 16px; }
    .activity-progress { margin-left: auto; color: var(--ink-soft); font-size: 13px; }
    .activity-desc { color: var(--ink-soft); font-size: 13px; margin: 6px 0; }
    .activity-todo { color: var(--gold); font-size: 13px; margin-top: 6px; }
    .status-badge {
      font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    }
    .badge-open { background: var(--accent-soft); color: var(--accent-ink); }
    .badge-running { background: var(--paper); color: var(--accent-ink); }
    .badge-done { background: var(--rule); color: var(--ink-soft); }
    .badge-cancelled { background: var(--paper); color: var(--red); }
    .member-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .member-chip {
      background: var(--paper-card); border-radius: 999px; padding: 2px 10px;
      font-size: 12px; color: var(--ink-soft);
    }
    .member-chip.member-me { background: var(--accent-soft); color: var(--accent-ink); }
    .work-block { margin: 14px 0; }
    .work-block h3 { font-size: 14px; margin: 0 0 6px; }
    .work-content { white-space: pre-wrap; margin: 6px 0; }
    .work-img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
    .muted { color: var(--ink-soft); font-size: 13px; }
  </style>
</head>
<body>
  <header class="toolbar profile-toolbar">
    <div class="auth-area" id="authArea"></div>
  </header>

  <main class="profile-main" id="activityMain">
    <section class="activity-section" id="mySection">
      <h2>我参加的活动</h2>
      <div id="myActivities"><p class="loading-msg">加载中…</p></div>
    </section>
    <section class="activity-section" id="activeSection">
      <h2>进行中的活动</h2>
      <div id="activeActivities"><p class="loading-msg">加载中…</p></div>
    </section>
    <section class="activity-section" id="archiveSection">
      <h2>活动归档</h2>
      <div id="archiveActivities"><p class="loading-msg">加载中…</p></div>
    </section>
  </main>

  <script src="/shared/auth.js?v=3"></script>
  <script src="/shared/motion.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/static/activities.js"></script>
</body>
</html>
