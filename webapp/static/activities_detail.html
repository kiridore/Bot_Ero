<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>活动详情</title>
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/motion.css" />
  <link rel="stylesheet" href="/shared/profile.css" />
  <style>
    .detail-section { margin-bottom: 24px; }
    .detail-section h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink-soft); }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table td { padding: 7px 0; font-size: 14px; vertical-align: top; }
    .info-table td:first-child {
      width: 88px; color: var(--ink-soft); white-space: nowrap;
    }
    .activity-card {
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .status-badge {
      font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
      margin-left: 8px; vertical-align: 2px;
    }
    .badge-open { background: var(--accent-soft); color: var(--accent-ink); }
    .badge-running { background: var(--paper); color: var(--accent-ink); }
    .badge-done { background: var(--rule); color: var(--ink-soft); }
    .badge-cancelled { background: var(--paper); color: var(--red); }
    .member-list { display: flex; flex-direction: column; gap: 6px; }
    .member-row {
      background: var(--paper-card); border-radius: 8px; padding: 8px 12px;
      font-size: 13px; color: var(--ink-soft);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .member-row .seq { color: var(--ink-soft); min-width: 22px; }
    .member-row.member-me { border: 1px solid var(--accent); }
    .member-next { margin-left: auto; color: var(--accent-ink); }
    .turn-highlight {
      background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px; font-size: 14px; color: var(--accent-ink);
    }
    .work-block { margin: 14px 0; }
    .work-block h3 { font-size: 14px; margin: 0 0 6px; }
    .work-content { white-space: pre-wrap; margin: 6px 0; }
    .work-img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
    .muted { color: var(--ink-soft); font-size: 13px; }
    .countdown { color: var(--gold); }
  </style>
</head>
<body>
  <header class="toolbar profile-toolbar">
    <div class="auth-area" id="authArea"></div>
  </header>

  <main class="profile-main" id="detailMain">
    <p class="loading-msg">加载中…</p>
  </main>

  <script src="/shared/auth.js?v=3"></script>
  <script src="/shared/motion.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/static/activities_detail.js"></script>
</body>
</html>
