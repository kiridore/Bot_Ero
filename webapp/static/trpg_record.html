<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跑团记录回顾</title>
  <script src="/shared/theme.js"></script>
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/motion.css" />
  <link rel="stylesheet" href="/shared/profile.css" />
  <link rel="stylesheet" href="/static/trpg.css" />
</head>
<body>
  <header class="toolbar profile-toolbar">
    <div class="auth-area" id="authArea"></div>
  </header>

  <nav class="trpg-tabs" aria-label="跑团页面">
    <a class="trpg-tab" href="/trpg">车卡</a>
    <a class="trpg-tab is-active" href="/trpg/records" aria-current="page">跑团记录</a>
  </nav>

  <main class="profile-main">
    <a class="back-link" href="/trpg/records">← 返回记录列表</a>
    <div class="section-head trpg-record-head">
      <div>
        <h2 id="recordTitle">加载中…</h2>
        <p class="trpg-meta" id="recordMeta"></p>
        <span class="trpg-badge" id="recordState"></span>
      </div>
      <div class="trpg-filters">
        <label class="trpg-filter">
          <input type="checkbox" id="revealToggle" />
          显示暗骰
        </label>
        <label class="trpg-filter">
          <input type="checkbox" id="oocToggle" />
          隐藏场外发言
        </label>
      </div>
    </div>
    <details class="trpg-sheets" id="sheetBox" hidden>
      <summary>参团角色卡（开始 / 结束）</summary>
      <div id="sheetList"></div>
    </details>
    <div class="trpg-thread" id="messageList"></div>
    <p class="empty-hint center" id="threadHint"></p>
  </main>

  <div class="trpg-fab" role="group" aria-label="记录页快捷操作">
    <button type="button" class="trpg-fab-btn" id="fabTop" title="回到顶部" aria-label="回到顶部"></button>
    <button type="button" class="trpg-fab-btn" id="fabSecret" title="隐藏暗骰" aria-label="隐藏暗骰"
            aria-pressed="true"></button>
    <button type="button" class="trpg-fab-btn" id="fabOoc" title="隐藏场外发言" aria-label="隐藏场外发言"
            aria-pressed="false"></button>
    <button type="button" class="trpg-fab-btn" id="fabDice" title="骰子结果：居中（点击切换）"
            aria-label="骰子结果：居中（点击切换）"></button>
  </div>

  <script src="/shared/auth.js?v=3"></script>
  <script src="/shared/motion.js"></script>
  <script src="/shared/lightbox.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/static/trpg_record.js"></script>
</body>
</html>
