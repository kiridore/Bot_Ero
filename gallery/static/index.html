<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打卡图库</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
</head>
<body>
  <header class="toolbar">
    <h1>打卡图库</h1>
    <div class="filters">
      <label>
        用户
        <select id="userFilter">
          <option value="">全部</option>
        </select>
      </label>
      <label>
        年份
        <input type="number" id="yearFilter" placeholder="全部" min="2000" max="2100" />
      </label>
      <button type="button" id="applyBtn">筛选</button>
      <span id="stats" class="stats"></span>
    </div>
    <div class="auth-area" id="authArea"></div>
  </header>

  <dialog id="loginDialog" class="login-dialog">
    <form method="dialog" id="loginForm">
      <h2>图库登录</h2>
      <p class="login-hint">请向机器人私聊发送 <code>/图库密钥</code> 获取密钥</p>
      <input type="password" id="loginKey" placeholder="粘贴登录密钥" autocomplete="off" required />
      <p class="login-error hidden" id="loginError"></p>
      <div class="login-actions">
        <button type="button" id="loginCancel">取消</button>
        <button type="submit" class="primary">登录</button>
      </div>
    </form>
  </dialog>

  <main>
    <div id="gallery" class="gallery" aria-live="polite"></div>
    <p id="sentinel" class="sentinel">加载中…</p>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <figure>
      <img id="lightboxImg" alt="" />
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/static/gallery.js"></script>
</body>
</html>
