<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页 · 打卡图库</title>
  <link rel="stylesheet" href="/shared/gallery.css" />
  <link rel="stylesheet" href="/shared/profile.css" />
</head>
<body>
  <header class="toolbar profile-toolbar">
    <a href="/" class="back-link">← 图库</a>
    <nav class="profile-nav">
      <a href="/profile" class="active">主页</a>
      <a href="/profile/checkin">打卡</a>
      <a href="/profile/shop">商店</a>
      <a href="/profile/settings">设置</a>
    </nav>
    <div class="auth-area" id="authArea"></div>
  </header>

  <main class="profile-main" id="profileMain">
    <p class="loading-msg">加载中…</p>
  </main>

  <dialog id="dayDialog" class="day-dialog">
    <div class="day-dialog-header">
      <h3 id="dayDialogTitle">当日打卡</h3>
      <button type="button" id="dayDialogClose" aria-label="关闭">×</button>
    </div>
    <div id="dayDialogGrid" class="day-dialog-grid"></div>
  </dialog>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <figure>
      <img id="lightboxImg" alt="" />
    </figure>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/static/profile.js"></script>
</body>
</html>
