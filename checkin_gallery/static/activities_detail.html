<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>活动详情 · 打卡图库</title>
  <link rel="stylesheet" href="/static/gallery.css" />
  <link rel="stylesheet" href="/static/profile.css" />
  <style>
    .detail-section { margin-bottom: 24px; }
    .detail-section h2 { font-size: 15px; margin: 0 0 10px; color: var(--text-dim, #9aa3b2); }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table td { padding: 7px 0; font-size: 14px; vertical-align: top; }
    .info-table td:first-child {
      width: 88px; color: var(--text-dim, #9aa3b2); white-space: nowrap;
    }
    .activity-card {
      background: var(--card-bg, #23272f);
      border: 1px solid var(--border, #333a45);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .status-badge {
      font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
      margin-left: 8px; vertical-align: 2px;
    }
    .badge-open { background: #2e5d3f; color: #9be6b4; }
    .badge-running { background: #2c4a63; color: #8ec9f0; }
    .badge-done { background: #3a3f4b; color: #b9c2d0; }
    .badge-cancelled { background: #4a3a3a; color: #d9a0a0; }
    .member-list { display: flex; flex-direction: column; gap: 6px; }
    .member-row {
      background: #2a2f3a; border-radius: 8px; padding: 8px 12px;
      font-size: 13px; color: #c9d2df;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .member-row .seq { color: var(--text-dim, #9aa3b2); min-width: 22px; }
    .member-row.member-me { border: 1px solid #3d6b4f; }
    .member-next { margin-left: auto; color: #8ec9f0; }
    .turn-highlight {
      background: #2c4a63; border: 1px solid #4a7ca3; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px; font-size: 14px; color: #cfe6f7;
    }
    .work-block { margin: 14px 0; }
    .work-block h3 { font-size: 14px; margin: 0 0 6px; }
    .work-content { white-space: pre-wrap; margin: 6px 0; }
    .work-img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
    .muted { color: var(--text-dim, #9aa3b2); font-size: 13px; }
    .countdown { color: #e5a050; }
  </style>
</head>
<body>
  <header class="toolbar profile-toolbar">
    <a href="/archive" class="back-link">← 活动</a>
    <nav class="profile-nav">
      <a href="/profile">主页</a>
      <a href="/profile/checkin">打卡</a>
      <a href="/profile/shop">商店</a>
      <a href="/profile/alarms">闹钟</a>
      <a href="/profile/trpg">跑团</a>
      <a href="/archive" class="active">活动</a>
      <a href="/profile/settings">设置</a>
    </nav>
    <div class="auth-area" id="authArea"></div>
  </header>

  <main class="profile-main" id="detailMain">
    <p class="loading-msg">加载中…</p>
  </main>

  <script src="/shared/auth.js"></script>
  <script src="/static/activities_detail.js"></script>
</body>
</html>
